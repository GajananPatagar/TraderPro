name: Build TraderPro HyperSpeed Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TraderPro Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Ensure Build-Tools 34
        run: |
          SDKMGR=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | head -n 1)
          yes | "$SDKMGR" --licenses || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"

      - name: Compile HyperSpeed Standalone APK
        working-directory: android-app
        run: |
          gradle assembleDebug assembleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../TraderPro-v15-HyperSpeed.apk

      - name: Upload TraderPro HyperSpeed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraderPro-v15-HyperSpeed-APK
          path: TraderPro-v15-HyperSpeed.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v15.0.${{ github.run_number }}
          name: "TraderPro v15.0 HyperSpeed (0ms Flash-Open Standalone APK #${{ github.run_number }})"
          files: |
            TraderPro-v15-HyperSpeed.apk
            index.html
