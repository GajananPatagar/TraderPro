plugins {
    id 'com.android.application'
}
android {
    namespace 'com.traderpro.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.traderpro.app"
        minSdk 24
        targetSdk 34
        versionCode 10000
        versionName "1000.0-Quantum-Neural"
    }
    signingConfigs {
        persistentKey {
            storeFile file("traderpro.keystore")
            storePassword "traderpro123"
            keyAlias "traderpro"
            keyPassword "traderpro123"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.persistentKey
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.persistentKey
        }
    }
    androidResources {
        noCompress 'bin', 'dat'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
