plugins {
    id 'com.android.application'
}
android {
    namespace 'com.traderpro.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.traderpro.app"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "12.0-Autonomous"
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
